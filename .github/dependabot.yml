# Managed centrally: replaces Renovate. Security updates are enabled org-wide via GitHub code security configuration.
# Carried over from renovate.json: @types/node tracks Lambda nodejs22.x; conventionalcommits@10 needs a release-notes-generator that isn't stable yet
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/test/infra/lambda-worker/image-assets1"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github_actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github_actions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      github_actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/src"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
